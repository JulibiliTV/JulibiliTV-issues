name: Usage question / 使用咨询
description: Ask how to use JuliBiliTV / 咨询应用使用方法
title: "[Question] "
body:
  - type: markdown
    attributes:
      value: |
        Ask in English or Chinese. Replies will appear here; no email address is needed.
        可使用中文或英文，后续直接在这里回复，不需要填写邮箱。
        This is public. For private support, see the support guide linked in the repository README.
        此处为公开渠道；私密问题请使用仓库首页支持指引中的联系方式。
  - type: textarea
    id: question
    attributes:
      label: Your question / 你的问题
      description: Describe what you want to do and what you have tried. / 描述你想完成的操作及已尝试的方法。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant context / 相关信息（可选）
      description: App/tvOS versions, device model, or media source type. Do not include server addresses or credentials. / 可填写 App 与 tvOS 版本、设备型号或媒体来源类型，不要包含服务器地址或凭据。
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / 隐私
      options:
        - label: I removed credentials and personal information from the text and attachments / 我已移除正文与附件中的凭据及个人信息
          required: true
